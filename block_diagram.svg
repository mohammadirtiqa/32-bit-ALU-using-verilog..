<text x="550" y="35" text-anchor="middle" font-family="Arial" font-size="27" font-weight="bold" fill="#111">32-Bit ALU Functional Block Diagram</text>
<text x="550" y="575" text-anchor="middle" font-family="Arial" font-size="15" fill="#444">Conceptual functional view; the RTL case statement performs operation selection.</text>
