<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#222"/></marker></defs>
<rect width="1100" height="620" fill="white"/>
<g font-family="Arial" fill="#111" stroke="#222" stroke-width="2">
<rect x="35" y="105" width="145" height="70" rx="8" fill="#e8f1ff"/><text x="107" y="135" text-anchor="middle" stroke="none" font-size="22">Operand A</text><text x="107" y="158" text-anchor="middle" stroke="none" font-size="16">32 bits</text>
<rect x="35" y="235" width="145" height="70" rx="8" fill="#e8f1ff"/><text x="107" y="265" text-anchor="middle" stroke="none" font-size="22">Operand B</text><text x="107" y="288" text-anchor="middle" stroke="none" font-size="16">32 bits</text>
<rect x="35" y="390" width="145" height="70" rx="8" fill="#fff2d9"/><text x="107" y="420" text-anchor="middle" stroke="none" font-size="20">ALU Control</text><text x="107" y="443" text-anchor="middle" stroke="none" font-size="16">4 bits</text>
<rect x="280" y="70" width="245" height="105" rx="8" fill="#e9f7e9"/><text x="402" y="110" text-anchor="middle" stroke="none" font-size="21">Arithmetic Unit</text><text x="402" y="140" text-anchor="middle" stroke="none" font-size="16">ADD / SUB</text>
<rect x="280" y="205" width="245" height="105" rx="8" fill="#e9f7e9"/><text x="402" y="245" text-anchor="middle" stroke="none" font-size="21">Logic Unit</text><text x="402" y="275" text-anchor="middle" stroke="none" font-size="16">AND / OR / XOR / NOR / NOT</text>
<rect x="280" y="340" width="245" height="105" rx="8" fill="#e9f7e9"/><text x="402" y="380" text-anchor="middle" stroke="none" font-size="21">Shift / Compare Unit</text><text x="402" y="410" text-anchor="middle" stroke="none" font-size="16">SLL / SRL / SRA / SLT / SLTU / EQ</text>
<rect x="650" y="205" width="190" height="120" rx="8" fill="#f4eaff"/><text x="745" y="250" text-anchor="middle" stroke="none" font-size="22">Result Select</text><text x="745" y="280" text-anchor="middle" stroke="none" font-size="16">Control-driven</text>
<rect x="910" y="205" width="155" height="80" rx="8" fill="#e8f1ff"/><text x="987" y="238" text-anchor="middle" stroke="none" font-size="21">Result</text><text x="987" y="263" text-anchor="middle" stroke="none" font-size="16">32 bits</text>
<rect x="910" y="355" width="155" height="95" rx="8" fill="#fff2d9"/><text x="987" y="385" text-anchor="middle" stroke="none" font-size="19">Status Flags</text><text x="987" y="412" text-anchor="middle" stroke="none" font-size="16">Zero / Carry /</text><text x="987" y="433" text-anchor="middle" stroke="none" font-size="16">Overflow</text>
</g>
